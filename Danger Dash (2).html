<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danger Dash</title>
<style>
:root{--bg:#0d1224;--ink:#f3efe2;--muted:#9aa3c0;--red:#ff4757;--blue:#3d8bff;--amber:#ffc24a;--btn:#1b2342;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1224}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:manipulation}
main{max-width:640px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:26px;font-weight:900;font-style:italic;letter-spacing:.5px}
h1 span{color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top small{color:var(--muted);font-size:14px}
canvas{width:100%;height:auto;display:block;border-radius:14px;background:#10172e;border:2px solid #232c52}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-size:20px;font-weight:800;color:var(--ink);background:var(--btn);border:2px solid #2e3a6b;border-radius:14px;padding:20px 10px;cursor:pointer;user-select:none}
button:active{background:#27325e}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button.go{grid-column:1/3;background:var(--red);border-color:var(--red);color:#fff}
p.help{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
</style>
</head>
<body>
<main>
<div class="top"><h1>DANGER <span>DASH</span></h1><small id="hud">Record : 0</small></div>
<canvas id="c" width="400" height="260" aria-label="Zone de jeu"></canvas>
<div class="pad">
<button id="jump">⬆ Sauter</button>
<button id="slide">⬇ Glisser</button>
<button id="start" class="go">Lancer la poursuite</button>
</div>
<p class="help">Saute par-dessus les caisses, glisse sous les enseignes. Chaque obstacle évité te rapproche du voleur ; chaque choc le laisse filer. Clavier : Espace/↑ pour sauter, ↓ pour glisser.</p>
</main>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=400,H=260,G=205,CX=90;
let st='ready',t=0,last=0,speed,meter,score,level,obs,spawnT,py,vy,slideT,inv,shake,msg,msgT,best=0,flash=0,dodges,coins=[],nc=0;
try{best=+localStorage.getItem('dd_best')||0}catch(e){}
const hud=document.getElementById('hud');
const bld=[];for(let i=0;i<14;i++){const w=40+Math.random()*50,h=60+Math.random()*100;bld.push({x:i*55,w,h,win:Array.from({length:12},()=>Math.random()<.4)})}

function reset(){speed=170;meter=40;score=0;level=1;obs=[];spawnT=1;py=0;vy=0;slideT=0;inv=0;shake=0;msg='';msgT=0;dodges=0;coins=[];nc=0}
function jump(){if(st==='ready'||st==='over'){startGame();return}if(st==='play'&&py===0&&slideT<=0){vy=-9.6}}
function slide(){if(st==='play'&&py===0&&slideT<=0){slideT=.6}}
function startGame(){reset();st='play'}
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();slide()}if(e.code==='Enter'&&st!=='play')startGame()});
const b=id=>document.getElementById(id);
b('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
b('slide').addEventListener('pointerdown',e=>{e.preventDefault();slide()});
b('start').addEventListener('click',startGame);
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();(e.clientY-r.top)>r.height/2?slide():jump()});

function spawnCoins(box){for(let i=0;i<5;i++){coins.push(box?{x:W+14+i*10,y:G-34-Math.sin(i/4*Math.PI)*16}:{x:W+60+i*16,y:G-9})}}
function spawn(){const box=Math.random()<.55;if(Math.random()<.75)spawnCoins(box);obs.push(box?{k:'box',x:W+20,w:24,h:24,y:G-24,done:0}:{k:'bar',x:W+20,w:34,h:12,y:G-30,done:0})}

function hurt(){if(inv>0)return;meter-=22;inv=1.2;shake=.25;msg='Aïe !';msgT=.7}

function update(dt){
 t+=dt;flash+=dt;
 if(st!=='play')return;
 // physique du policier
 if(py<0||vy<0){vy+=34*dt;py+=vy*60*dt*.6*1;if(py>=0){py=0;vy=0}}
 if(slideT>0)slideT-=dt;
 if(inv>0)inv-=dt;if(shake>0)shake-=dt;if(msgT>0)msgT-=dt;
 const sp=speed+level*14;
 score+=sp*dt/10;
 spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.7,1.5-level*.12)+Math.random()*.6}
 const h=slideT>0?16:36, top=G+py-h;
 for(const o of obs){
  o.x-=sp*dt;
  if(!o.done&&o.x+o.w>CX-9&&o.x<CX+9){
   if(top<o.y+o.h&&G+py>o.y){hurt();o.done=2}
  }
  if(!o.done&&o.x+o.w<CX-9){o.done=1;meter+=5;dodges++;if(dodges%5===0){msg='Série !';msgT=.7}}
 }
 obs=obs.filter(o=>o.x>-50);
 for(const c of coins){c.x-=sp*dt;if(!c.got&&Math.abs(c.x-CX)<11&&c.y>top-4&&c.y<G+py+4){c.got=1;nc++;score+=10;meter+=1.5}}
 coins=coins.filter(c=>c.x>-20&&!c.got);
 meter-=2.2*dt*(1+level*.15);
 if(meter>=100){st='caught';msg='Arrêté !';msgT=1.6;setTimeout(()=>{if(st==='caught'){level++;meter=40;obs=[];st='play';msg='Niveau '+level;msgT=1.2}},1600)}
 if(meter<=0){st='over';msg='';try{if(score>best){best=Math.floor(score);localStorage.setItem('dd_best',best)}}catch(e){}}
 hud.textContent='Niveau '+level+' · 🪙 '+nc+' · Score '+Math.floor(score)+' · Record '+Math.max(best,Math.floor(score));
}

function person(x,y,h,col,legT,cop,hide){
 // y = pieds ; h = hauteur
 ctx.fillStyle=col;
 const lg=Math.sin(legT)*6;
 if(h>30){
  ctx.fillRect(x-4+lg,y-12,5,12);ctx.fillRect(x-1-lg,y-12,5,12);
  ctx.fillRect(x-6,y-h+10,12,h-22);
  ctx.fillStyle='#e8b98a';ctx.beginPath();ctx.arc(x,y-h+6,6,0,7);ctx.fill();
 }else{
  ctx.fillRect(x-14,y-10,28,8);
  ctx.fillStyle='#e8b98a';ctx.beginPath();ctx.arc(x+14,y-9,5,0,7);ctx.fill();
 }
 if(cop){ctx.fillStyle=col;const hy=h>30?y-h:y-16;ctx.fillRect((h>30?x:x+14)-7,hy-1,14,4);
  ctx.fillStyle=Math.floor(flash*6)%2?'#ff4757':'#3d8bff';ctx.fillRect((h>30?x:x+14)-3,hy-5,6,4)}
 else{ctx.fillStyle='#000';ctx.fillRect(x-5,y-h+3,10,3);ctx.fillStyle=col;ctx.fillRect(x+4,y-h+12,0,0)}
}

function draw(){
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6);
 // ciel
 const g=ctx.createLinearGradient(0,0,0,G);g.addColorStop(0,'#0a0f22');g.addColorStop(1,'#1d2750');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // immeubles
 const sc=(t*(st==='play'?30:8))%770;
 for(const bd of bld){const x=((bd.x-sc)%770+770)%770-60;ctx.fillStyle='#141c3a';ctx.fillRect(x,G-bd.h,bd.w,bd.h);
  bd.win.forEach((on,i)=>{if(on){ctx.fillStyle='#ffc24a';ctx.globalAlpha=.55;ctx.fillRect(x+6+(i%4)*10,G-bd.h+8+Math.floor(i/4)*14,5,7);ctx.globalAlpha=1}})}
 // trottoir
 ctx.fillStyle='#262f58';ctx.fillRect(0,G,W,H-G);
 ctx.fillStyle='#394580';ctx.fillRect(0,G,W,3);
 const sp=st==='play'?speed+level*14:0;
 ctx.fillStyle='#4a579a';for(let i=0;i<10;i++){const x=((i*50-(t*sp))%500+500)%500-50;ctx.fillRect(x,G+28,26,3)}
 // lampadaires
 for(let i=0;i<3;i++){const x=((i*200-t*sp*.6)%600+600)%600-60;ctx.fillStyle='#39426e';ctx.fillRect(x,G-95,3,95);ctx.fillStyle='#ffc24a';ctx.fillRect(x-8,G-98,19,5);
  ctx.globalAlpha=.1;ctx.beginPath();ctx.moveTo(x-8,G-93);ctx.lineTo(x-34,G);ctx.lineTo(x+37,G);ctx.lineTo(x+11,G-93);ctx.fill();ctx.globalAlpha=1}
 // obstacles
 for(const o of obs){
  if(o.k==='box'){ctx.fillStyle='#b9824a';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#6e4a28';ctx.lineWidth=2;ctx.strokeRect(o.x+1,o.y+1,o.w-2,o.h-2);ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.stroke()}
  else{ctx.fillStyle='#444c7a';ctx.fillRect(o.x+o.w/2-1,0,2,o.y);ctx.fillStyle='#ffc24a';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#10172e';ctx.fillRect(o.x+4,o.y+4,o.w-8,4)}
 }
 for(const c of coins){const w=Math.abs(Math.cos(t*6+c.x*.08))*5+1.5;ctx.fillStyle='#ffc24a';ctx.beginPath();ctx.ellipse(c.x,c.y,w,6,0,0,7);ctx.fill();ctx.strokeStyle='#b8801a';ctx.lineWidth=1.5;ctx.stroke()}
 // voleur
 const gap=Math.max(0,100-meter)*1.75+36;
 const tx=CX+gap;let ty=0;
 for(const o of obs){const d=o.x-tx;if(o.k==='box'&&d>-20&&d<40){ty=-Math.sin((1-(d+20)/60)*Math.PI)*34}}
 person(tx,G+ty,34,'#6b2fa0',t*14,false);
 ctx.fillStyle='#ffc24a';ctx.fillRect(tx-14,G+ty-28,8,10);ctx.fillStyle='#10172e';ctx.font='bold 9px sans-serif';ctx.fillText('$',tx-12,G+ty-20);
 // policier
 if(!(inv>0&&Math.floor(t*14)%2)){
  const h=slideT>0?16:36;person(CX,G+py,h,'#2f6fe0',t*16,true)}
 // gyrophare
 const fl=Math.floor(flash*6)%2;
 ctx.fillStyle=fl?'rgba(255,71,87,.13)':'rgba(61,139,255,.13)';ctx.fillRect(0,0,W,H);
 ctx.restore();
 // jauge
 ctx.fillStyle='#10172e';ctx.fillRect(10,10,160,12);
 ctx.fillStyle=meter>60?'#4ade80':meter>30?'#ffc24a':'#ff4757';ctx.fillRect(10,10,Math.max(0,Math.min(100,meter))*1.6,12);
 ctx.strokeStyle='#f3efe2';ctx.lineWidth=1.5;ctx.strokeRect(10,10,160,12);
 ctx.fillStyle='#f3efe2';ctx.font='bold 11px sans-serif';ctx.fillText('Écart avec le voleur',10,36);
 if(msgT>0){ctx.textAlign='center';ctx.font='900 30px sans-serif';ctx.fillStyle='#ffc24a';ctx.fillText(msg,W/2,95);ctx.textAlign='left'}
 if(st==='ready'||st==='over'){
  ctx.fillStyle='rgba(8,12,28,.78)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.fillStyle='#f3efe2';ctx.font='900 32px sans-serif';
  ctx.fillText(st==='ready'?'DANGER DASH':'Il s’est échappé !',W/2,100);
  ctx.font='16px sans-serif';ctx.fillStyle='#9aa3c0';
  ctx.fillText(st==='ready'?'Rattrape le voleur avant qu’il ne disparaisse':'Score : '+Math.floor(score)+' · Niveau '+level,W/2,130);
  ctx.fillStyle='#ffc24a';ctx.fillText('Touche l’écran ou appuie sur Espace',W/2,165);ctx.textAlign='left'}
}

function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
